# eTribunal — Observabilidad (Grafana LGTM: Prometheus + Tempo + Loki + Alloy + Grafana)
#
# Overlay opcional sobre docker-compose.yml. Se usa junto con el compose base:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#     --profile app --profile floci-local --profile observability up -d --build
# (o directamente con scripts\docker-up.bat obs)
#
# Efectos sobre las apps:
#   - LOGGING_STRUCTURED_FORMAT=ecs  → logs JSON estructurados (incluyen trace.id/span.id)
#   - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tempo:9411/api/v2/spans → trazas a Tempo
# Sin el overlay, las apps usan el comportamiento por defecto (logs planos, sin trazas).
#
# Puertos:
#   Grafana :3001 (admin/admin) · Prometheus :9090 · Tempo :3200 (+ :9411 Zipkin recv)
#   Loki :3100 · Alloy :12345 (UI)

services:
  # ─────────────── Apps: apuntan trazas y logs al stack ───────────────
  gateway-service:
    environment:
      LOGGING_STRUCTURED_FORMAT: ecs
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans

  identity-service:
    environment:
      LOGGING_STRUCTURED_FORMAT: ecs
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans

  core-domain-service:
    environment:
      LOGGING_STRUCTURED_FORMAT: ecs
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans

  ai-engine-service:
    environment:
      LOGGING_STRUCTURED_FORMAT: ecs
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans

  # ─────────────── Observabilidad (profile: observability) ───────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: etribunal-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  loki:
    image: grafana/loki:3.2.1
    container_name: etribunal-loki
    profiles: ["observability"]
    ports:
      - "3100:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  tempo:
    image: grafana/tempo:2.6.1
    container_name: etribunal-tempo
    profiles: ["observability"]
    # Los volúmenes se montan sobre /tmp/tempo-* (root-owned en la imagen y el
    # contenedor corre con uid 10001): correr como root evita permission denied.
    user: "0:0"
    ports:
      - "3200:3200"
      - "9411:9411"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo-traces
      - tempo-wal:/tmp/tempo-wal
    command:
      - -config.file=/etc/tempo.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  alloy:
    image: grafana/alloy:v1.4.1
    container_name: etribunal-alloy
    profiles: ["observability"]
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy.config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    container_name: etribunal-grafana
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  tempo-wal:
  grafana-data: