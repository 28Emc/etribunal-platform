# eTribunal — App Stack (solo servicios de la plataforma + UI)
#
# Servicios:
#   - gateway-service  :8080   API Gateway (Spring Cloud Gateway)
#   - identity-service :8081   Auth + Users + Follows
#   - core-domain-service :8082  Cases + Votes + Comments + Media
#   - ai-engine-service :8083   Automation + Moderación IA
#   - etribunal-ui     :3000   Frontend React + Vite (pnpm dev)
#
# Requisitos previos:
#   - Infraestructura externa levantada (infra-local en D:\Trabajo\Otros\infra-local)
#     docker compose -f D:\Trabajo\Otros\infra-local\docker-compose.yml up -d
#   - Red externa: docker network create etribunal-net
#   - Variables en .env.dev (endpoints infra) + .env (secrets)
#
# Uso:
#   docker compose --env-file .env.dev up -d --build
#   docker compose logs -f -t --tail=100
#   docker compose down

services:
  # ─────────────────────────────────────────────────────────────
  # GATEWAY — API Gateway (punto de entrada único)
  # ─────────────────────────────────────────────────────────────
  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    image: etribunal/gateway-service
    container_name: etribunal-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${FLOCI_HOST:-host.docker.internal}:${FLOCI_IDENTITY_PORT:-7002}/etribunal_identity"
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81}
      IDENTITY_URL: http://identity-service:8081
      CORE_URL: http://core-domain-service:8082
      AI_URL: http://ai-engine-service:8083
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-0123456789abcdef0123456789abcdef}
      LOGGING_STRUCTURED_FORMAT: ${LOGGING_STRUCTURED_FORMAT:-console}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://host.docker.internal:9411/api/v2/spans}
    networks:
      - etribunal-net
    depends_on:
      - identity-service
      - core-domain-service
      - ai-engine-service
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # IDENTITY — Auth + Users + Follows
  # ─────────────────────────────────────────────────────────────
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    image: etribunal/identity-service
    container_name: etribunal-identity
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${FLOCI_HOST:-host.docker.internal}:${FLOCI_IDENTITY_PORT:-7002}/etribunal_identity"
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-0123456789abcdef0123456789abcdef}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-fedcba9876543210fedcba9876543210}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-only-internal-token-1234}
      LOGGING_STRUCTURED_FORMAT: ${LOGGING_STRUCTURED_FORMAT:-console}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://host.docker.internal:9411/api/v2/spans}
    networks:
      - etribunal-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # CORE DOMAIN — Cases + Votes + Comments + Media
  # ─────────────────────────────────────────────────────────────
  core-domain-service:
    build:
      context: .
      dockerfile: services/core-domain-service/Dockerfile
    image: etribunal/core-domain-service
    container_name: etribunal-core
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${FLOCI_HOST:-host.docker.internal}:${FLOCI_CORE_PORT:-7003}/etribunal_core"
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-only-internal-token-1234}
      IDENTITY_BASE_URL: http://identity-service:8081/api
      S3_ENDPOINT: ${FLOCI_S3_ENDPOINT:-http://host.docker.internal:4566}
      S3_PUBLIC_ENDPOINT: ${FLOCI_S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${FLOCI_S3_BUCKET:-etribunal-media}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://host.docker.internal:9411/api/v2/spans}
      LOGGING_STRUCTURED_FORMAT: ${LOGGING_STRUCTURED_FORMAT:-console}
    networks:
      - etribunal-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # AI ENGINE — Automation + Moderación IA
  # ─────────────────────────────────────────────────────────────
  ai-engine-service:
    build:
      context: .
      dockerfile: services/ai-engine-service/Dockerfile
    image: etribunal/ai-engine-service
    container_name: etribunal-ai
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      CORE_DB_HOST: ${FLOCI_HOST:-host.docker.internal}
      CORE_DB_PORT: ${FLOCI_CORE_PORT:-7003}
      CORE_DB_NAME: etribunal_core
      CORE_DB_USER: ${FLOCI_DB_USER:-etribunal_user}
      CORE_DB_PASS: ${FLOCI_DB_PASS:-etribunal_pass}
      IDENTITY_DB_URL: "jdbc:postgresql://${FLOCI_HOST:-host.docker.internal}:${FLOCI_IDENTITY_PORT:-7002}/etribunal_identity"
      IDENTITY_DB_USER: ${FLOCI_DB_USER:-etribunal_user}
      IDENTITY_DB_PASS: ${FLOCI_DB_PASS:-etribunal_pass}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-0123456789abcdef0123456789abcdef}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-fedcba9876543210fedcba9876543210}
      JWT_ISSUER: etribunal
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.8}
      AI_TOP_P: ${AI_TOP_P:-0.95}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
      AUTOMATION_DRY_RUN: ${AUTOMATION_DRY_RUN:-false}
      AUTOMATION_RUN_HOUR: ${AUTOMATION_RUN_HOUR:-9}
      AUTOMATION_LANGUAGE: ${AUTOMATION_LANGUAGE:-es}
      AUTOMATION_DAILY_CASES_MIN: ${AUTOMATION_DAILY_CASES_MIN:-1}
      AUTOMATION_DAILY_CASES_MAX: ${AUTOMATION_DAILY_CASES_MAX:-5}
      AUTOMATION_USERS_PER_CASE_MIN: ${AUTOMATION_USERS_PER_CASE_MIN:-5}
      AUTOMATION_USERS_PER_CASE_MAX: ${AUTOMATION_USERS_PER_CASE_MAX:-15}
      AUTOMATION_MAX_PER_USER_MIN: ${AUTOMATION_MAX_PER_USER_MIN:-1}
      AUTOMATION_MAX_PER_USER_MAX: ${AUTOMATION_MAX_PER_USER_MAX:-3}
      AUTOMATION_INTENSITY_MIN: ${AUTOMATION_INTENSITY_MIN:-30}
      AUTOMATION_INTENSITY_MAX: ${AUTOMATION_INTENSITY_MAX:-70}
      AUTOMATION_INTERVAL_MIN: ${AUTOMATION_INTERVAL_MIN:-30}
      AUTOMATION_INTERVAL_MAX: ${AUTOMATION_INTERVAL_MAX:-180}
      AUTOMATION_WINDOW_HOURS: ${AUTOMATION_WINDOW_HOURS:-24}
      AUTOMATION_POOL_SIZE: ${AUTOMATION_POOL_SIZE:-0}
      IDENTITY_URL: http://identity-service:8081/api
      CORE_URL: http://gateway-service:8080/api
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://host.docker.internal:9411/api/v2/spans}
      LOGGING_STRUCTURED_FORMAT: ${LOGGING_STRUCTURED_FORMAT:-console}
    networks:
      - etribunal-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # FRONTEND — React + Vite (pnpm dev con HMR)
  # ─────────────────────────────────────────────────────────────
  etribunal-ui:
    build:
      context: ../etribunal-ui
      dockerfile: Dockerfile
    image: etribunal/ui
    container_name: etribunal-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
      VITE_WS_URL: ${VITE_WS_URL:-http://localhost:8083/ws/automation}
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3000}
      VITE_APP_NAME: ${VITE_APP_NAME:-eTribunal}
      VITE_ENABLE_TRANSLATIONS: ${VITE_ENABLE_TRANSLATIONS:-false}
    networks:
      - etribunal-net
    depends_on:
      - gateway-service
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  etribunal-net:
    external: true
    name: etribunal-net