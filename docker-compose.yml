# eTribunal — Docker Compose completo (v1.1)
#
# Servicios incluidos:
#   - Floci (RDS emulator en :4566, DB proxies en :7001-7099) — profile: floci-local
#   - Redis standalone (:6379)
#   - Gateway (:8080) → Identity (:8081), Core (:8082), AI Engine (:8083)
#
# Uso rápido:
#   docker compose up -d                     # solo infra (Redis)
#   docker compose --profile app up -d       # infra + 4 Spring services
#   docker compose --profile floci-local up -d  # + Floci (RDS emulator)
#   docker compose --profile zipkin up -d    # + Zipkin (tracing)
#   docker compose --profile temporal up -d  # + Temporal + UI
#   docker compose --profile app --profile floci-local up -d  # todo junto (modo docker)
#   docker compose --profile kafka up -d     # + Kafka KRaft single-node (opcional)
#
# Prerequisito: construir jars antes de levantar servicios Spring
#   cd etribunal-platform && ./gradlew bootJar

services:
  # ─────────────── Infra ───────────────
  floci:
    image: floci/floci:latest
    container_name: etribunal-floci
    profiles: ["floci-local"]
    ports:
      - "4566:4566"
      - "7001-7099:7001-7099"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: etribunal-redis
    command: redis-server --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Crea el bucket S3 una sola vez al levantar Floci (idempotente).
  # Media uploads (casos) usan presigned URLs contra etribunal-media.
  floci-init:
    image: amazon/aws-cli:latest
    container_name: etribunal-floci-init
    profiles: ["floci-local"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://floci:4566 s3 mb s3://etribunal-media 2>/dev/null
        aws --endpoint-url http://floci:4566 s3 ls
    depends_on:
      floci:
        condition: service_healthy
    restart: "no"

  # Kafka single-node (KRaft) — opt-in. No requerido para arrancar:
  # producción de eventos es best-effort (sin broker el sistema sigue andando).
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: etribunal-kafka
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/etc/confluent/docker/kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─────────────── App Services ───────────────
  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    image: etribunal/gateway-service
    container_name: etribunal-gateway
    profiles: ["app"]
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_ACCESS_SECRET: "dev-only-access-secret-0123456789abcdef0123456789abcdef"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81"
    depends_on:
      redis:
        condition: service_healthy

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    image: etribunal/identity-service
    container_name: etribunal-identity
    profiles: ["app"]
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:7002/etribunal_identity
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: "eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81"
      JWT_ACCESS_SECRET: "dev-only-access-secret-0123456789abcdef0123456789abcdef"
      JWT_REFRESH_SECRET: "dev-only-refresh-secret-fedcba9876543210fedcba9876543210"
      INTERNAL_API_KEY: "dev-only-internal-token-1234"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  core-domain-service:
    build:
      context: .
      dockerfile: services/core-domain-service/Dockerfile
    image: etribunal/core-domain-service
    container_name: etribunal-core
    profiles: ["app"]
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:7003/etribunal_core
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: "eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81"
      INTERNAL_API_KEY: "dev-only-internal-token-1234"
      IDENTITY_BASE_URL: http://identity-service:8081/api
      S3_ENDPOINT: http://host.docker.internal:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: etribunal-media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  ai-engine-service:
    build:
      context: .
      dockerfile: services/ai-engine-service/Dockerfile
    image: etribunal/ai-engine-service
    container_name: etribunal-ai
    profiles: ["app"]
    ports:
      - "8083:8083"
    environment:
      CORE_DB_HOST: host.docker.internal
      CORE_DB_PORT: "7003"
      CORE_DB_NAME: etribunal_core
      CORE_DB_USER: etribunal_user
      CORE_DB_PASS: etribunal_pass
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
      AI_API_KEY: ${AI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────── Zipkin (opt-in) ───────────────
  zipkin:
    image: openzipkin/zipkin:3.0
    container_name: etribunal-zipkin
    profiles: ["zipkin"]
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9411/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ─────────────── Temporal (opt-in) ───────────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: etribunal-temporal
    profiles: ["temporal"]
    environment:
      DB: postgres12
      POSTGRES_SEEDS: host.docker.internal
      POSTGRES_PORT: "7002"
      POSTGRES_USER: etribunal_user
      POSTGRES_PWD: etribunal_pass
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    container_name: etribunal-temporal-ui
    profiles: ["temporal"]
    environment:
      TEMPORAL_ADDRESS: host.docker.internal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8233:8080"
    depends_on:
      - temporal
