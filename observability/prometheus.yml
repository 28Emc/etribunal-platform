# eTribunal — Prometheus scrape config (modo Docker local)
#
# Rutas de /actuator/prometheus por servicio:
#   - gateway/ai-engine: sin context-path →  /actuator/prometheus
#   - identity/core:     context-path /api →  /api/actuator/prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]
        labels: { service: gateway-service }

  - job_name: identity-service
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["identity-service:8081"]
        labels: { service: identity-service }

  - job_name: core-domain-service
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["core-domain-service:8082"]
        labels: { service: core-domain-service }

  - job_name: ai-engine-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ai-engine-service:8083"]
        labels: { service: ai-engine-service }