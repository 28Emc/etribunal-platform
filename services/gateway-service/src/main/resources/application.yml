server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes: [] # rutas activas solo en perfil local (ver abajo)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:} # perfil local → password dev (ver abajo)

# Sin fallback: en produccion JWT_ACCESS_SECRET debe venir por entorno (fail-fast)
etribunal:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    issuer: ${JWT_ISSUER:etribunal}
  gateway:
    enabled: true
    public-paths:
      # Auth (legacy: sin guard o con throttling)
      - /api/auth/register
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/forgot-password
      - /api/auth/reset-password
      - /api/auth/verify-email
      - /api/auth/resend-verification
      - /api/auth/check-existence
      # Perfiles públicos de users (legacy: OptionalJwtAuthGuard)
      - /api/users/search
      - /api/users/top-judges
      - /api/users/*
      - /api/users/*/followers
      - /api/users/*/following
      - /api/users/*/cases
      - /api/users/*/track-share
      # Búsqueda unificada (legacy: OptionalJwtAuthGuard)
      - /api/search/quick
      - /api/search/advanced
      # Trending / Active Users (legacy: OptionalJwtAuthGuard)
      - /api/cases/trending/top
      - /api/cases/active-users
      # Feed de casos y detalle (legacy: OptionalJwtAuthGuard)
      - /api/cases
      - /api/cases/*
      - /api/cases/invite/*
      - /api/cases/*/track-share
      # Comentarios (legacy: OptionalJwtAuthGuard en GET, sin guard en /comments/:commentId/replies)
      - /api/comments/cases/*
      - /api/comments/comments/*/replies
      # Saved cases share count (legacy: sin guard en GET /saved-cases/:caseId/shares)
      - /api/saved-cases/*/shares
      # Analytics admin: protegido por SysadminApiKeyGuard en core (X-Sysadmin-Api-Key), sin JWT edge
      - /api/analytics/**
  migration:
    enabled: ${MIGRATION_ENABLED:false}
    nestjs-url: ${NESTJS_URL:http://localhost:3001/api}
    canary:
      enabled: ${CANARY_ENABLED:false}
      default-percentage: ${CANARY_DEFAULT_PCT:0}
    shadow:
      enabled: ${SHADOW_ENABLED:false}
      log-differences: ${SHADOW_LOG_DIFF:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}

---
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      password: eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: core-domain-users-me-votes
              uri: http://localhost:8082
              predicates:
                - Path=/api/users/me/votes
            - id: core-domain-analytics
              uri: http://localhost:8082
              predicates:
                - Path=/api/analytics/**
            - id: core-domain-user-cases
              uri: http://localhost:8082
              predicates:
                - Path=/api/users/*/cases
            - id: core-domain-users-track-share
              uri: http://localhost:8082
              predicates:
                - Path=/api/users/*/track-share
            - id: identity
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/users/*/followers,/api/users/*/following
            - id: core-domain
              uri: http://localhost:8082
              predicates:
                - Path=/api/cases/**,/api/comments/**,/api/reactions/**,/api/saved-cases/**,/api/notifications/**,/api/search/**,/api/media/**,/api/reports/**,/api/votes/**,/api/upload/**,/api/translations/**
            - id: ai-engine
              uri: http://localhost:8083
              predicates:
                - Path=/api/automation/**
  management:
    zipkin:
      tracing:
        endpoint: ""

etribunal:
  jwt:
    # DEV ONLY - debe coincidir con identity-service (mismos secretos compartidos)
    access-secret: "dev-only-access-secret-0123456789abcdef0123456789abcdef"
    issuer: etribunal
  migration:
    # Local: deshabilitado por defecto; habilitar con env vars
    enabled: ${MIGRATION_ENABLED:false}
    nestjs-url: ${NESTJS_URL:http://localhost:3001/api}
    canary:
      enabled: ${CANARY_ENABLED:false}
      default-percentage: ${CANARY_DEFAULT_PCT:0}
    shadow:
      enabled: ${SHADOW_ENABLED:false}
      log-differences: ${SHADOW_LOG_DIFF:false}

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
