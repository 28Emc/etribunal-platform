server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes: [] # rutas activas solo en perfil local (ver abajo)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    gateway:
      routes:
        - id: identity
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: core-domain
          uri: http://localhost:8082
          predicates:
            - Path=/api/cases/**,/api/comments/**,/api/reactions/**,/api/saved-cases/**,/api/notifications/**
        - id: ai-engine
          uri: http://localhost:8083
          predicates:
            - Path=/api/automation/**
