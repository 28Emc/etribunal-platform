# ⚠️ PERFIL LOCAL — SOLO DESARROLLO.
# PostgreSQL vía Floci RDS (instancia etribunal-core-local, puerto de DescribeDBInstances).
# Redis standalone :6379. Kafka diferido a Fase 1.

spring:
  datasource:
    url: jdbc:postgresql://localhost:7003/etribunal_core
    username: etribunal_user
    password: etribunal_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      password: eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81 # redis standalone del host
  kafka:
    # Diferido a Fase 1 — sin broker local por ahora; Spring lo inicializa lazy
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  health:
    kafka:
      enabled: false # sin broker en Fase 0

logging:
  level:
    com.etribunal: DEBUG
