# ⚠️ PERFIL LOCAL — SOLO DESARROLLO.
# PostgreSQL vía Floci RDS (instancia etribunal-core-local, puerto de DescribeDBInstances).
# Redis standalone :6379. Kafka diferido a Fase 1.
# Modo Floci: EXTERNAL (default, Floci externo) | DOCKER (Floci en docker-compose profile floci-local)

spring:
  datasource:
    url: jdbc:postgresql://${FLOCI_HOST:localhost}:${FLOCI_CORE_PORT:7003}/etribunal_core
    username: etribunal_user
    password: etribunal_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81 # redis standalone del host
  kafka:
    # Diferido a Fase 1 — sin broker local por ahora; Spring lo inicializa lazy
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  health:
    kafka:
      enabled: false # sin broker en Fase 0

etribunal:
  moderation:
    poll-interval-ms: ${MODERATION_POLL_INTERVAL_MS:5000}
  sysadmin:
    api-key: ${SYSADMIN_API_KEY:dev-only-sysadmin-key-1234}
  internal:
    identity-base-url: ${IDENTITY_BASE_URL:http://localhost:8081/api}
    core-base-url: ${CORE_BASE_URL:http://localhost:8082/api}
    token: ${INTERNAL_API_KEY:dev-only-internal-token-1234} # igual que identity
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    bucket: ${S3_BUCKET:etribunal-media}

logging:
  level:
    com.etribunal: DEBUG
