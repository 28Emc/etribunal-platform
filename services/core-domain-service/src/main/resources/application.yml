server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: core-domain-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}

---
spring:
  config:
    activate:
      on-profile: local
  management:
    zipkin:
      tracing:
        endpoint: http://localhost:9411/api/v2/spans
