server:
  port: 8083

spring:
  application:
    name: ai-engine-service
  datasource:
    url: jdbc:postgresql://${CORE_DB_HOST:localhost}:${CORE_DB_PORT:7003}/${CORE_DB_NAME:etribunal_core}
    username: ${CORE_DB_USER:etribunal_user}
    password: ${CORE_DB_PASS:etribunal_pass}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ai-engine-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
